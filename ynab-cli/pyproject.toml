[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-cli"
version = "0.1.0"
description = "Small CLI for exploring YNAB plans"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15,<1",
    "ynab>=5.0,<6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ynab-cli = "ynab_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
